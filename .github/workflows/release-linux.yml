name: Linux release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (must match the source versions)'
        required: true
        type: string
      force:
        description: 'Attach Linux assets even if Linux is unchanged since the previous release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Versions move in lockstep with macOS, so a release can change macOS alone.
  # It then gets no Linux assets, and the Linux update notice, which looks for
  # the newest release with a .deb, does not offer it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.diff.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare Linux inputs with the previous release
        id: diff
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "linux=true" >> "$GITHUB_OUTPUT"
            echo "Linux assets forced for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 linux/tools/linux_changed.py --tag "$RELEASE_TAG" > linux-changes.txt
            cat linux-changes.txt
            { echo '```'; cat linux-changes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  package:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/check_version.py --tag "$RELEASE_TAG"
      - name: Verify and build
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
          node --check gnome-extension/extension.js
          node --test tests/*.test.mjs
      - name: Package Linux downloads
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          python3 tools/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.arch }}
          path: linux/target/debian/*.deb
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: linux-gnome-extension
          path: linux/target/hotch-gnome-*.zip

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true
      - name: Attach verified Linux assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        working-directory: assets
        run: |
          sha256sum ./*.deb ./*.zip > SHA256SUMS-linux.txt
          gh release upload "$RELEASE_TAG" ./*.deb ./*.zip SHA256SUMS-linux.txt --clobber
