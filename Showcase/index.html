<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Desktop","default":"#2B2533"},
    {"id":"color-ink","type":"color","label":"Text","default":"#F4F2FA"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#F5A524"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #2b2533;
        --color-ink: #f4f2fa;
        --color-accent: #f5a524;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* The desktop: a solid ground with radial washes (linear gradients band in video). */
      #desktop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 0% 0%, rgba(34, 42, 68, 0.85), transparent 60%),
          radial-gradient(circle at 24% 74%, rgba(242, 140, 77, 0.38), transparent 34%),
          radial-gradient(circle at 80% 26%, rgba(64, 191, 217, 0.26), transparent 30%),
          var(--color-ground);
      }
      #menubar {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 30px;
        padding: 0 32px;
        background: rgba(12, 10, 20, 0.4);
        font: 500 26px/1 "Inter", sans-serif;
        color: var(--color-ink);
        font-variant-numeric: tabular-nums;
      }
      #menubar .status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.14);
      }
      #menubar svg {
        width: 18px;
        height: 26px;
      }
      #menubar .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--color-accent);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-xw3d"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.2"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-nuev" id="desktop">
        <div data-hf-id="hf-xr4o" id="menubar" data-layout-ignore>
          <span data-hf-id="hf-761c" class="status">
            <svg data-hf-id="hf-vig5" viewBox="21 10 54 80" aria-hidden="true">
              <path data-hf-id="hf-hbei" d="M60 16 C17 21 17 79 60 84" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" />
              <circle data-hf-id="hf-6ov2" cx="65" cy="50" r="11" fill="currentColor" />
            </svg>
            <i data-hf-id="hf-6bgx" class="dot"></i>63%
          </span>
          <span data-hf-id="hf-ndxo">Thu 9:41</span>
        </div>
      </div>

      <div data-hf-id="hf-32rz"

      ></div>
      <div data-hf-id="hf-73hx"

      <div data-hf-id="hf-e8rp"

</html>
