<!doctype html>
<!--
  Hotch reel: the real app, recorded with `Hotch --demo-tour` in a dark and a
  light take, composited onto the desktop in plates/desktop.html, then framed
  here. One camera moves both takes; a sweep between them shows light and dark.
  Each clip is a window onto a take: tour time = reel time - data-start + data-media-start.

  Footage (Showcase/footage, not in Git) is rebuilt with the steps in README.md.
  Desktop coordinates below are points on the 2560 x 1440 recording; the
  footage is 1.5 px per point.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050507; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050507;
        font-family: "Inter", sans-serif; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; }

      /* Two takes under one camera. The light take is revealed by a sweep. */
      .layer { position: absolute; inset: 0; }
      #light-layer { --a: -400px; --b: -400px;
        clip-path: polygon(var(--a) 0, var(--b) 0, calc(var(--b) - 300px) 100%, calc(var(--a) - 300px) 100%); }
      .cam { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; transform-origin: 0 0; }
      .screen { position: absolute; inset: 0; border-radius: 36px; overflow: hidden; }
      #root .screen img, #root .screen video { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; display: block; }
      #screen-shadow { position: absolute; inset: 0; border-radius: 36px;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.10), 0 60px 160px rgba(0,0,0,0.6); }
      #sweep { position: absolute; left: 0; top: -40px; width: 240px; height: 1160px; transform-origin: 50% 0;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,244,236,0.55) 50%, rgba(255,255,255,0));
        mix-blend-mode: screen; opacity: 0; }

      #cursor { position: absolute; left: 0; top: 0; width: 27px; height: 40px; overflow: visible;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35)); opacity: 0; }

      /* Captions: Inter Display, lower left, on a soft scrim. */
      .scrim { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
      #scrim-dark { background: radial-gradient(90% 75% at 0% 100%, rgba(6,5,10,0.78) 0%, rgba(6,5,10,0.45) 40%, rgba(6,5,10,0) 72%); }
      #scrim-light { background: radial-gradient(90% 75% at 0% 100%, rgba(250,247,244,0.88) 0%, rgba(250,247,244,0.5) 40%, rgba(250,247,244,0) 72%); }
      #scrim-top { background: radial-gradient(90% 75% at 0% 0%, rgba(6,5,10,0.72) 0%, rgba(6,5,10,0.4) 40%, rgba(6,5,10,0) 72%); }
      #root .cap { position: absolute; left: 112px; bottom: 112px; width: 980px; }
      #root .cap.top { bottom: auto; top: 104px; }
      .cap h2 { font-weight: 660; font-size: 80px; line-height: 1.02; letter-spacing: -0.035em; color: #f5f5f7; }
      .cap p { margin-top: 18px; font-weight: 420; font-size: 29px; line-height: 1.36; letter-spacing: -0.012em;
        color: rgba(245,245,247,0.68); max-width: 760px; font-variation-settings: "opsz" 20; }
      .cap.ink h2 { color: #1d1d1f; }
      .cap.ink p { color: rgba(29,29,31,0.62); }
      .cap .w { display: inline-block; }
      .roll { position: relative; display: block; height: 84px; overflow: hidden; }
      .roll .stack { position: absolute; left: 0; top: 0; }
      .roll .stack span { display: block; height: 84px; line-height: 82px; color: #f5a524; }

      /* Title and end cards: plain type on black. */
      #root .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; color: #f5f5f7; }
      #title h1 { font-weight: 680; font-size: 112px; letter-spacing: -0.04em; line-height: 1; }
      #title p { margin-top: 26px; font-weight: 420; font-size: 34px; letter-spacing: -0.015em; color: rgba(245,245,247,0.62);
        font-variation-settings: "opsz" 24; }
      #fade { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(60% 55% at 50% 46%, rgba(255,140,102,0.10), transparent 70%), #050507; }
      #end .lockup { display: flex; align-items: center; gap: 30px; }
      #end svg { width: 76px; height: 112px; overflow: visible; }
      #end .word { font-weight: 700; font-size: 128px; letter-spacing: -0.045em; line-height: 1; }
      #end .line { margin-top: 34px; font-weight: 440; font-size: 36px; letter-spacing: -0.015em; color: rgba(245,245,247,0.72);
        font-variation-settings: "opsz" 24; }
      #end .url { margin-top: 16px; font-weight: 500; font-size: 30px; letter-spacing: 0; color: #ff8c66;
        font-variation-settings: "opsz" 18; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1920" data-height="1080">

      <div class="layer" id="dark-layer">
        <div class="cam" data-layout-allow-overflow>
          <div id="screen-shadow"></div>
          <div class="screen">
            <img src="footage/plate-dark.jpg" alt="" />
            <video id="dark-ai" class="clip" src="footage/desk-dark.mp4" muted data-start="1.2" data-duration="4" data-media-start="0.6"></video>
            <video id="dark-ses" class="clip" src="footage/desk-dark.mp4" muted data-start="5.2" data-duration="3.9" data-media-start="6.3"></video>
            <video id="dark-notch" class="clip" src="footage/desk-dark.mp4" muted data-start="13.9" data-duration="3.7" data-media-start="24.2"></video>
            <video id="dark-pill" class="clip" src="footage/desk-dark.mp4" muted data-start="17.6" data-duration="1.6" data-media-start="38.9"></video>
            <video id="dark-dock" class="clip" src="footage/desk-dark.mp4" muted data-start="20.8" data-duration="2.6" data-media-start="49.4"></video>
          </div>
        </div>
      </div>

      <div class="layer" id="light-layer">
        <div class="cam" data-layout-allow-overflow>
          <div class="screen">
            <img src="footage/plate-light.jpg" alt="" />
            <video id="light-ses" class="clip" src="footage/desk-light.mp4" muted data-start="5.2" data-duration="3.9" data-media-start="6.3"></video>
            <video id="light-mac" class="clip" src="footage/desk-light.mp4" muted data-start="9.1" data-duration="2.6" data-media-start="11"></video>
            <video id="light-close" class="clip" src="footage/desk-light.mp4" muted data-start="11.7" data-duration="0.4" data-media-start="16.2"></video>
            <video id="light-alert" class="clip" src="footage/desk-light.mp4" muted data-start="12.1" data-duration="2.5" data-media-start="17.7"></video>
            <video id="light-orb" class="clip" src="footage/desk-light.mp4" muted data-start="19.2" data-duration="1.6" data-media-start="44.15"></video>
          </div>
        </div>
      </div>
      <div id="sweep"></div>

      <div class="layer">
        <div class="cam" id="cursor-cam" data-layout-allow-overflow>
          <svg id="cursor" viewBox="0 0 24 36" aria-hidden="true">
            <path id="cursor-path" d="M2 2 L2 28 L8.5 22 L13 32.5 L17 30.8 L12.6 20.6 L21 20.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <div class="scrim" id="scrim-dark"></div>
      <div class="scrim" id="scrim-light"></div>
      <div class="scrim" id="scrim-top"></div>

      <div id="title" class="card clip" data-start="0" data-duration="1.6">
        <h1><span class="w">Meet</span> <span class="w">Hotch.</span></h1>
      </div>

      <div id="c-ai" class="cap clip" data-start="2.85" data-duration="2.3"><h2>AI limits, at a glance.</h2></div>
      <div id="c-ses" class="cap clip" data-start="5.85" data-duration="1.6"><h2>Every agent, live.</h2></div>
      <div id="c-theme" class="cap ink clip" data-start="7.6" data-duration="1.4"><h2>Light or dark.</h2></div>
      <div id="c-mac" class="cap ink clip" data-start="9.75" data-duration="1.85"><h2>Your Mac, too.</h2></div>
      <div id="c-alert" class="cap ink clip" data-start="12.35" data-duration="1.8"><h2>Taps you when it matters.</h2></div>
      <div id="c-notch" class="cap clip" data-start="15.05" data-duration="2.4"><h2>Where it all started.</h2></div>
      <div id="c-homes" class="cap top clip" data-start="17.65" data-duration="4.95" data-layout-allow-occlusion>
        <h2>Or keep it<span class="roll" data-layout-allow-overlap data-layout-allow-overflow><span class="stack"><span>as a pill.</span><span>as an orb.</span><span>beside the Dock.</span></span></span></h2>
      </div>

      <div id="fade"></div>
      <div id="end" class="card clip" data-start="23" data-duration="3">
        <div class="lockup">
          <svg viewBox="21 10 54 80" aria-hidden="true">
            <path id="e-curve" d="M60 16 C17 21 17 79 60 84" fill="none" stroke="#f7f5ed" stroke-width="12" stroke-linecap="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
            <circle id="e-signal" cx="65" cy="50" r="10" fill="#ff8c66" />
          </svg>
          <div class="word">Hotch</div>
        </div>
        <div class="line">Free and open source for macOS.</div>
        <div class="url">github.com/hotherside/Hotch</div>
      </div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const P = 1.5; // footage pixels per desktop point
        const cams = ".layer .cam";

        // Frame desktop point (x, y) at the centre of the shot, at scale s of the footage.
        const frame = (s, x, y) => ({ scale: s, x: 960 - x * P * s, y: 540 - y * P * s });
        const cam = (t, s, x, y, duration, ease) =>
          tl.to(cams, { ...frame(s, x, y), duration, ease: ease || "power3.inOut" }, t);
        const cut = (t, s, x, y) => tl.set(cams, frame(s, x, y), t);

        // Cursor, in footage pixels.
        const at = (x, y) => ({ x: x * P, y: y * P });
        const move = (t, x, y, duration) => tl.to("#cursor", { ...at(x, y), duration: duration || 0.5, ease: "power2.inOut" }, t);
        const press = (t) => {
          tl.to("#cursor", { scale: 0.86, transformOrigin: "8% 6%", duration: 0.06, ease: "power2.in" }, t);
          tl.to("#cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, t + 0.06);
        };

        // Headlines in and out. Timed elements keep their own opacity, so fades act on what is inside them.
        const capIn = (sel, t) => tl.fromTo(sel + " h2", { opacity: 0, y: 16, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "expo.out" }, t);
        const capOut = (sel, t) => tl.to(sel + " > *", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, t);
        const scrim = (sel, t, on) => tl.to(sel, { opacity: on ? 1 : 0, duration: 0.3, ease: "power2.inOut" }, t);

        // Sweep between takes, in screen space. Edge `--b` reveals light, `--a` returns to dark.
        const sweep = (t, edge, duration) => {
          tl.to("#light-layer", { [edge]: "2420px", duration, ease: "power2.inOut" }, t);
          tl.fromTo("#sweep", { x: -520, skewX: -15.5, opacity: 0.9 },
            { x: 2300, skewX: -15.5, duration, ease: "power2.inOut" }, t);
          tl.set("#sweep", { opacity: 0 }, t + duration);
        };
        const light = (t, on) => tl.set("#light-layer", on ? { "--a": "-400px", "--b": "2420px" } : { "--a": "-400px", "--b": "-400px" }, t);

        // 0 to 1.9: the title, and the screen rising under it.
        tl.fromTo("#title h1", { scale: 1.06 }, { scale: 1, duration: 1.1, ease: "expo.out" }, 0);
        tl.to("#title > *", { opacity: 0, y: -40, duration: 0.4, ease: "power3.in" }, 1.15);
        tl.fromTo(cams, { ...frame(0.42, 1280, 720), y: 1200 },
          { ...frame(0.42, 1280, 720), duration: 0.8, ease: "expo.out" }, 1.15);

        // Straight in to the edge; the card opens on AI as the move lands (2.73).
        cam(1.95, 0.95, 1890, 560, 0.75);
        tl.set("#cursor", { ...at(1500, 1300), opacity: 1 }, 1.8);
        move(1.9, 2537, 397, 0.65);
        scrim("#scrim-dark", 2.7, true);
        capIn("#c-ai", 2.9);
        capOut("#c-ai", 4.95);

        // Sessions (5.75), then light or dark across the open card.
        move(5.2, 2537, 441, 0.4);
        press(5.68);
        capIn("#c-ses", 5.9);
        capOut("#c-ses", 7.27);
        sweep(7.4, "--b", 0.8);
        scrim("#scrim-dark", 7.45, false);
        scrim("#scrim-light", 7.55, true);
        capIn("#c-theme", 7.7);
        capOut("#c-theme", 8.82);

        // This Mac (9.68), from the card's own tab bar.
        move(9.0, 2354, 358, 0.45);
        press(9.6);
        capIn("#c-mac", 9.8);
        capOut("#c-mac", 11.42);

        // The card closes (11.81) and an alert grows out of the tab (12.29); a click acts on it.
        move(11.35, 2050, 760, 0.4);
        cam(11.75, 1.0, 1920, 500, 0.5);
        capIn("#c-alert", 12.4);
        move(13.2, 2380, 440, 0.5);
        press(13.9);
        capOut("#c-alert", 13.97);

        // Back to dark on the way up to the notch, where the panel opens on hover (14.95).
        sweep(14.0, "--a", 0.6);
        scrim("#scrim-light", 14.0, false);
        light(14.65, false);
        cam(13.95, 1.0, 1280, 360, 0.75);
        move(14.0, 1286, 18, 0.8);
        scrim("#scrim-dark", 14.7, true);
        capIn("#c-notch", 15.1);
        move(16.9, 1700, 700, 0.5);
        tl.to("#cursor", { opacity: 0, duration: 0.2 }, 17.3);
        capOut("#c-notch", 17.27);
        scrim("#scrim-dark", 17.3, false);

        // Homes: a pill (dark), an orb (light), beside the Dock (dark).
        cut(17.6, 1.0, 1920, 600);
        scrim("#scrim-top", 17.6, true);
        capIn("#c-homes", 17.7);
        tl.to("#c-homes .stack", { y: -84, duration: 0.3, ease: "power3.inOut" }, 19.1);
        light(19.2, true);
        tl.set("#c-homes", { attr: { class: "cap top clip ink" } }, 19.2);
        tl.set("#scrim-top", { background: "radial-gradient(90% 75% at 0% 0%, rgba(250,247,244,0.88) 0%, rgba(250,247,244,0.5) 40%, rgba(250,247,244,0) 72%)" }, 19.2);
        tl.to("#c-homes .stack", { y: -168, duration: 0.3, ease: "power3.inOut" }, 20.7);
        light(20.8, false);
        tl.set("#c-homes", { attr: { class: "cap top clip" } }, 20.8);
        tl.set("#scrim-top", { background: "radial-gradient(90% 75% at 0% 0%, rgba(6,5,10,0.72) 0%, rgba(6,5,10,0.4) 40%, rgba(6,5,10,0) 72%)" }, 20.8);
        cut(20.8, 1.0, 1250, 1080);
        capOut("#c-homes", 22.35);
        scrim("#scrim-top", 22.3, false);

        // Pull back, then the end card.
        cam(22.3, 0.42, 1280, 720, 0.9);
        tl.to("#fade", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 22.95);
        tl.fromTo("#e-curve", { attr: { "stroke-dashoffset": 100 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 23.2);
        tl.fromTo("#e-signal", { scale: 0, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.3, ease: "back.out(2)" }, 23.6);
        tl.fromTo("#end .word", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 23.55);
        tl.fromTo("#end .line", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 23.75);
        tl.fromTo("#end .url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 23.9);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
